<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#11110f">
    <title>BYD SHARK 6 | Offline</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #11110f;
            color: #f3f0e8;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        main { max-width: 520px; }

        img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            margin-bottom: 24px;
        }

        h1 {
            font-size: clamp(28px, 7vw, 44px);
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        p {
            color: #aaa99f;
            line-height: 1.7;
        }

        button {
            margin-top: 20px;
            padding: 14px 26px;
            border: 0;
            border-radius: 4px;
            background: #d9e0df;
            color: #11110f;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <img src="_Assets/Branding/icon-192.png" alt="BYD SHARK 6">
        <h1>YOU'RE OFFLINE</h1>
        <p>
            Your BYD SHARK 6 digital showroom is currently unavailable
            because there's no internet connection.
        </p>
        <p>
            Previously visited showroom pages may still be available.
            Please reconnect and try again.
        </p>
        <button onclick="location.reload()">TRY AGAIN</button>
    </main>
</body>
</html>
